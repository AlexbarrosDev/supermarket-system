spring:

  application:
    name:   supermarket-system

  devtools:
    restart:
      enabled: true

  profiles:
    active: false

  mvc:
    throw-exception-if-no-handler-found: true

  web:
    resources:
      add-mappings: false

  datasource:
    url:      jdbc:mysql://localhost:3306/supermarket?useTimezone=true&serverTimezone=UTC
    username: developer
    password: 198106

  jpa:
    hibernate:
      ddl-auto:   validate
    open-in-view: false
    show-sql:     true

  flyway:
    enabled: true
    validate-on-migrate: true

logging:
  level:
    root: WARN
    br.com.alexdev: DEBUG